<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по философии</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lora&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #f0ede8;
            --card:      #ffffff;
            --ink:       #1c1c2e;
            --muted:     #7a7a8c;
            --accent:    #3d5a99;
            --accent-lt: #eef2fa;
            --green:     #27ae60;
            --green-lt:  #d5f5e3;
            --red:       #e74c3c;
            --red-lt:    #fadbd8;
            --radius:    14px;
            --shadow:    0 8px 32px rgba(0,0,0,0.10);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 60px;
        }

        /* ── HEADER ── */
        header {
            text-align: center;
            margin-bottom: 36px;
        }
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            color: var(--ink);
            letter-spacing: .02em;
        }
        header p {
            font-family: 'Lora', serif;
            color: var(--muted);
            font-size: .95rem;
            margin-top: 6px;
        }

        /* ── PROGRESS ── */
        .progress-wrap {
            width: 100%;
            max-width: 680px;
            margin-bottom: 24px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .progress-bar-track {
            height: 6px;
            background: #ddd;
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 99px;
            transition: width .5s cubic-bezier(.4,0,.2,1);
        }

        /* ── CARD ── */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 40px;
            width: 100%;
            max-width: 680px;
            animation: fadeSlide .35s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .q-type-badge {
            display: inline-block;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-lt);
            border-radius: 6px;
            padding: 3px 10px;
            margin-bottom: 14px;
        }

        .q-text {
            font-family: 'Lora', serif;
            font-size: 1.15rem;
            color: var(--ink);
            line-height: 1.65;
            margin-bottom: 28px;
        }

        /* ── OPTIONS ── */
        .options { display: flex; flex-direction: column; gap: 12px; }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px;
            border: 2px solid #e8e8ee;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color .2s, background .2s, transform .15s;
            user-select: none;
        }
        .option-label:hover { border-color: var(--accent); background: var(--accent-lt); transform: translateX(3px); }
        .option-label input { accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; cursor: pointer; }
        .option-label span { font-size: .97rem; color: var(--ink); line-height: 1.5; }

        /* results highlights */
        .option-label.correct  { border-color: var(--green); background: var(--green-lt); }
        .option-label.incorrect { border-color: var(--red);   background: var(--red-lt); }
        .option-label.correct input,
        .option-label.incorrect input { pointer-events: none; }

        /* ── NAV ── */
        .nav {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .1s, opacity .2s;
        }
        .btn:active { transform: scale(.97); }
        .btn-back {
            background: #e8e8ee;
            color: var(--ink);
        }
        .btn-back:hover { background: #d8d8e4; }
        .btn-next {
            background: var(--accent);
            color: #fff;
        }
        .btn-next:hover { background: #2e4a88; }
        .btn-submit {
            background: #27ae60;
            color: #fff;
        }
        .btn-submit:hover { background: #219150; }
        .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

        /* ── RESULT CARD ── */
        .result-card {
            display: none;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 680px;
            text-align: center;
            animation: fadeSlide .4s ease;
        }
        .result-card.show { display: block; }

        .result-icon { font-size: 3rem; margin-bottom: 12px; }
        .result-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .result-card .big-score {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin: 16px 0;
        }
        .result-card .sub {
            color: var(--muted);
            font-size: .95rem;
            margin-bottom: 28px;
        }

        .btn-review {
            background: var(--accent-lt);
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 12px 28px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-right: 10px;
            transition: background .2s;
        }
        .btn-review:hover { background: #d6e0f5; }
        .btn-restart {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }
        .btn-restart:hover { background: #2e4a88; }

        /* ── REVIEW MODE ── */
        #review-container {
            display: none;
            width: 100%;
            max-width: 680px;
            flex-direction: column;
            gap: 20px;
        }
        #review-container.show { display: flex; }
        .review-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 32px;
        }
        .review-card .q-text { margin-bottom: 16px; }

        @media (max-width: 520px) {
            .card, .result-card, .review-card { padding: 24px 18px; }
            .nav { flex-direction: column; }
        }

        /* ── TITLE SCREEN ── */
        #title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 680px;
            animation: fadeSlide .45s ease;
        }
        .title-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 56px 48px 48px;
            width: 100%;
            text-align: center;
        }
        .title-logo { font-size: 3.2rem; margin-bottom: 20px; }
        .title-main {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.9rem, 5vw, 2.8rem);
            color: var(--ink);
            letter-spacing: .02em;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .title-divider {
            width: 48px; height: 3px;
            background: var(--accent);
            border-radius: 99px;
            margin: 18px auto 22px;
        }
        .title-sub {
            font-family: 'Lora', serif;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.75;
            margin-bottom: 36px;
        }
        .title-sub strong { color: var(--ink); font-style: italic; }
        .btn-start {
            display: inline-block;
            padding: 15px 52px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: .03em;
            transition: background .2s, transform .15s;
        }
        .btn-start:hover  { background: #2e4a88; }
        .btn-start:active { transform: scale(.97); }

        /* ── ANSWERS TABLE ── */
        .answers-wrap {
            display: none;
            width: 100%;
            max-width: 680px;
            margin-top: 20px;
            animation: fadeSlide .4s ease;
        }
        .answers-wrap.show { display: block; }
        .answers-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 32px;
            overflow-x: auto;
        }
        .answers-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--ink);
            margin-bottom: 20px;
        }
        .ans-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .86rem;
        }
        .ans-table th {
            text-align: left;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 2px solid #e8e8ee;
            padding: 6px 10px 10px;
            white-space: nowrap;
        }
        .ans-table td {
            padding: 10px 10px;
            border-bottom: 1px solid #f0f0f5;
            vertical-align: top;
            line-height: 1.45;
            color: var(--ink);
        }
        .ans-table tr:last-child td { border-bottom: none; }
        .ans-table tr.row-ok   { background: #f5fef8; }
        .ans-table tr.row-bad  { background: #fff8f7; }
        .ans-num  { width: 32px; color: var(--muted); font-weight: 700; text-align: center; }
        .ans-q    { max-width: 200px; }
        .ans-a    { max-width: 140px; }
        .ans-v    { width: 36px; text-align: center; font-size: 1.05rem; font-weight: 700; }
        .ans-v.ok  { color: var(--green); }
        .ans-v.bad { color: var(--red); }
        .ans-correct-text { color: var(--green); font-size: .8rem; margin-top: 3px; }

        @media (max-width: 520px) {
            .title-card  { padding: 36px 20px 32px; }
            .answers-card { padding: 20px 12px; }
            .ans-table   { font-size: .78rem; }
            .btn-start   { padding: 13px 36px; font-size: 1rem; }
        }
        /* Стили для фиксированного футера */
        .quiz-footer {
            position: fixed;
            bottom: 15px; /* Отступ от нижнего края экрана */
            left: 50%;
            transform: translateX(-50%); /* Точное центрирование по горизонтали */
            text-align: center;
            z-index: 1000; /* Чтобы футер всегда был поверх других элементов */
        }
        .quiz-footer a {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.95em;
            color: #7f8c8d; /* Спокойный серый цвет */
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s, border-bottom 0.2s;
            padding-bottom: 2px;
            border-bottom: 1px solid transparent;
        }
        .quiz-footer a:hover {
            color: #3498db; /* Меняет цвет под стиль теста */
            border-bottom: 1px solid #3498db; /* Появляется линия подчеркивания */
        }

    </style>
</head>
<body>

<!-- Title screen -->
<div id="title-screen">
    <div class="title-card">
        <div class="title-logo">📖</div>
        <h1 class="title-main">Тест по Философии</h1>
        <div class="title-divider"></div>
        <p class="title-sub">
            На одну попытку будут случайно выбраны<br>
            <strong>20 вопросов из 200</strong>
        </p>
        <button class="btn-start" onclick="startQuiz()">Начать тест →</button>
    </div>
</div>

<header id="main-header" style="display:none">
    <h1>Тест по философии</h1>
</header>

<!-- Progress -->
<div class="progress-wrap" id="progress-wrap" style="display:none">
    <div class="progress-label">
        <span id="progress-text">Вопрос 1 из 20</span>
        <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
</div>

<!-- Question card -->
<div class="card" id="question-card" style="display:none">
    <div class="q-type-badge" id="q-badge"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options-container"></div>
    <div class="nav">
        <button class="btn btn-back" id="btn-back" onclick="goBack()">← Назад</button>
        <button class="btn btn-next" id="btn-next" onclick="goNext()">Далее →</button>
        <button class="btn btn-submit" id="btn-submit" onclick="submitQuiz()" style="display:none">Узнать результат</button>
    </div>
</div>

<!-- Result -->
<div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <h2>Ваш результат</h2>
    <div class="big-score" id="big-score"></div>
    <div class="sub" id="result-sub"></div>
    <button class="btn-review" onclick="showReview()">Разбор ошибок</button>
    <button class="btn-restart" onclick="restartQuiz()">Пройти заново</button>
</div>

<!-- Answers table -->
<div class="answers-wrap" id="answers-wrap">
    <div class="answers-card">
        <h3>Таблица ответов</h3>
        <table class="ans-table">
            <thead>
                <tr>
                    <th class="ans-num">№</th>
                    <th class="ans-q">Вопрос</th>
                    <th class="ans-a">Ваш ответ</th>
                    <th class="ans-a">Правильный ответ</th>
                    <th class="ans-v"></th>
                </tr>
            </thead>
            <tbody id="answers-tbody"></tbody>
        </table>
    </div>
</div>

<!-- Review -->
<div id="review-container"></div>

<script>
// ─── КОЛ-ВО ВОПРОСОВ В ОДНОЙ СЕССИИ ───────────────────
const QUIZ_SIZE = 20;

// ─── ПОЛНЫЙ ПУЛ ВОПРОСОВ ───────────────────────────────
// Добавляйте новые вопросы сюда — в начало, конец или середину,
// порядок не важен: каждый раз будут выбираться случайные QUIZ_SIZE.
// Числовые префиксы в тексте не нужны — нумерация идёт через прогресс-бар.
const ALL_QUESTIONS = [
    {
        text: "Что является предметом философии согласно классическому (марксистскому) определению?",
        type: "radio",
        options: [
            { text: "А) Изучение текстов Священного Писания", correct: false },
            { text: "Б) Наиболее общие и фундаментальные законы природы, общества и мышления", correct: true },
            { text: "В) Поиск смысла жизни отдельного индивида", correct: false },
            { text: "Г) Законы развития исключительно человеческого общества", correct: false }
        ]
    },
    {
        text: "Какие из перечисленных разделов относятся к структуре философии?",
        type: "checkbox",
        options: [
            { text: "А) Онтология", correct: true },
            { text: "Б) Гносеология", correct: true },
            { text: "В) Астрология", correct: false },
            { text: "Г) Аксиология", correct: true }
        ]
    },
    {
        text: "Как звучит основной вопрос философии?",
        type: "radio",
        options: [
            { text: "А) В чем смысл жизни?", correct: false },
            { text: "Б) Что первично — материя или сознание?", correct: true },
            { text: "В) Что есть истина?", correct: false },
            { text: "Г) Познаваем ли мир?", correct: false }
        ]
    },
    {
        text: "Какие формы дуализма получили распространение в Новое время?",
        type: "checkbox",
        options: [
            { text: "А) Деизм", correct: true },
            { text: "Б) Объективный идеализм", correct: false },
            { text: "В) Пантеизм", correct: true },
            { text: "Г) Наивный материализм", correct: false }
        ]
    },
    {
        text: "Какие из перечисленных функций относятся к основным или дополнительным функциям философии?",
        type: "checkbox",
        options: [
            { text: "А) Формирование мировоззрения", correct: true },
            { text: "Б) Методологическая", correct: true },
            { text: "В) Критическая", correct: true },
            { text: "Г) Вычислительная", correct: false }
        ]
    },
    {
        text: "Какой тезис характерен для научного (диалектического) материализма К. Маркса и Ф. Энгельса?",
        type: "radio",
        options: [
            { text: "А) Бытие определяет сознание", correct: true },
            { text: "Б) Сознание определяет бытие", correct: false },
            { text: "В) Мир создан демиургом", correct: false },
            { text: "Г) Душа человека бессмертна", correct: false }
        ]
    },
    {
        text: "Какая философская позиция Нового времени выражается формулой «Бог есть всё, и всё есть Бог» (Б. Спиноза)?",
        type: "radio",
        options: [
            { text: "А) Деизм", correct: false },
            { text: "Б) Пантеизм", correct: true },
            { text: "В) Объективный идеализм", correct: false },
            { text: "Г) Агностицизм", correct: false }
        ]
    },
    {
        text: "Как называется устоявшаяся система взглядов на мир, когда речь идет о больших социальных группах?",
        type: "radio",
        options: [
            { text: "А) Аксиология", correct: false },
            { text: "Б) Эпистемология", correct: false },
            { text: "В) Менталитет", correct: true },
            { text: "Г) Правосознание", correct: false }
        ]
    },
    {
        text: "Что принципиально отличает философское мышление от мифологического и религиозного?",
        type: "checkbox",
        options: [
            { text: "А) Философия строится на логике и аргументации", correct: true },
            { text: "Б) Философия иррациональна в своей основе", correct: false },
            { text: "В) Философия требует доказательств и обоснований", correct: true },
            { text: "Г) Философия принимает мир как данность, не требуя доказательств", correct: false }
        ]
    },
    {
        text: "Какая философская концепция является основой универсальных правовых норм в юриспруденции (согласно лекциям)?",
        type: "radio",
        options: [
            { text: "А) Сократовская майевтика", correct: false },
            { text: "Б) Категорический императив И. Канта", correct: true },
            { text: "В) Пантеизм Б. Спинозы", correct: false },
            { text: "Г) Субъективный идеализм Дж. Беркли", correct: false }
        ]
    },
    {
        text: "Какие черты, согласно Аристотелю и логике, характерны для понятийного мышления?",
        type: "checkbox",
        options: [
            { text: "А) Абстрактность", correct: true },
            { text: "Б) Доказательность", correct: true },
            { text: "В) Опора на стереотипы", correct: false },
            { text: "Г) Эмоционально-образное описание", correct: false }
        ]
    },
    {
        text: "Кто из мыслителей относился к Милетской школе и какие первоосновы они предлагали?",
        type: "checkbox",
        options: [
            { text: "А) Фалес Милетский (вода)", correct: true },
            { text: "Б) Гераклит (огонь)", correct: false },
            { text: "В) Анаксимен (воздух)", correct: true },
            { text: "Г) Пифагор (число)", correct: false }
        ]
    },
    {
        text: "Как в античной гносеологии называлось ненадежное знание, основанное на ощущениях?",
        type: "radio",
        options: [
            { text: "А) Эпистеме", correct: false },
            { text: "Б) Докса", correct: true },
            { text: "В) Логос", correct: false },
            { text: "Г) Апейрон", correct: false }
        ]
    },
    {
        text: "Какие elements составляют принципы сократовской диалектики?",
        type: "checkbox",
        options: [
            { text: "А) Ирония", correct: true },
            { text: "Б) Майевтика", correct: true },
            { text: "В) Дедукция", correct: false },
            { text: "Г) Признание незнания", correct: true }
        ]
    },
    {
        text: "Какой закон диалектики объясняет развитие через механизм «тезис — антитезис — синтез»?",
        type: "radio",

            { text: "А) В конфликте между формой и содержанием нормы", correct: true },
            { text: "Б) В способе написания текста", correct: false },
            { text: "В) В количестве сторон в процессе", correct: false },
            { text: "Г) В языке закона", correct: false }
        ]
    },
    {
        text: "Что такое «герменевтический круг»?",
        type: "radio",
        options: [
            { text: "А) Метод логического доказательства", correct: false },
            { text: "Б) Необходимость понимания целого через части и частей через целое", correct: true },
            { text: "В) Замкнутость правовой системы", correct: false },
            { text: "Г) Способ уклонения от правосудия", correct: false }
        ]
    },
    {
        text: "Чем естественное право отличается от позитивного?",
        type: "radio",
        options: [
            { text: "А) Оно всегда написано", correct: false },
            { text: "Б) Оно вытекает из природы разума, а не из воли государства", correct: true },
            { text: "В) Оно создано судом", correct: false },
            { text: "Г) Оно не существует", correct: false }
        ]
    },
    {
        text: "Как правосознание влияет на право?",
        type: "radio",
        options: [
            { text: "А) Никак не влияет", correct: false },
            { text: "Б) Формирует основу правового регулирования и восприятия права", correct: true },
            { text: "В) Заменяет право", correct: false },
            { text: "Г) Устраняет все законы", correct: false }
        ]
    }
];

// ─── СЛУЧАЙНАЯ ВЫБОРКА (Fisher-Yates) ─────────────────
function pickQuestions() {
    const pool = ALL_QUESTIONS.slice();                    // копия пула
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];          // перемешать
    }
    return pool.slice(0, Math.min(QUIZ_SIZE, pool.length)); // взять первые N
}

// ─── СОСТОЯНИЕ СЕССИИ ─────────────────────────────────
let questions = pickQuestions();   // вопросы текущей сессии
let answers   = questions.map(() => []); // ответы пользователя
let current   = 0;

/* ─── START (title screen → quiz) ─── */
function startQuiz() {
    document.getElementById('title-screen').style.display  = 'none';
    document.getElementById('main-header').style.display   = '';
    document.getElementById('progress-wrap').style.display = '';
    document.getElementById('question-card').style.display = '';
    renderQuestion(0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─── RENDER ─── */
function renderQuestion(index) {
    const q = questions[index];
    const card = document.getElementById('question-card');

    // force re-animation
    card.style.animation = 'none';
    card.offsetHeight; // reflow
    card.style.animation = '';

    // badge
    document.getElementById('q-badge').textContent =
        q.type === 'radio' ? 'Один правильный ответ' : 'Несколько правильных ответов';

    document.getElementById('q-text').textContent = q.text;

    const cont = document.getElementById('options-container');
    cont.innerHTML = '';

    q.options.forEach((opt, oIndex) => {
        const label = document.createElement('label');
        label.className = 'option-label';

        const input = document.createElement('input');
        input.type = q.type;
        input.name = 'q' + index;
        input.value = oIndex;
        input.checked = answers[index].includes(oIndex);

        input.addEventListener('change', () => {
            if (q.type === 'radio') {
                answers[index] = [oIndex];
            } else {
                if (input.checked) {
                    if (!answers[index].includes(oIndex)) answers[index].push(oIndex);
                } else {
                    answers[index] = answers[index].filter(v => v !== oIndex);
                }
            }
        });

        const span = document.createElement('span');
        span.textContent = opt.text;

        label.appendChild(input);
        label.appendChild(span);
        cont.appendChild(label);
    });

    updateProgress(index);
    updateNav(index);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress(index) {
    const total = questions.length;
    const pct = Math.round((index / total) * 100);
    document.getElementById('progress-text').textContent =
        'Вопрос ' + (index + 1) + ' из ' + total;
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

function updateNav(index) {
    const isLast = index === questions.length - 1;
    document.getElementById('btn-back').disabled = index === 0;
    document.getElementById('btn-next').style.display  = isLast ? 'none'  : '';
    document.getElementById('btn-submit').style.display = isLast ? '' : 'none';
}

function goNext() {
    if (current < questions.length - 1) { current++; renderQuestion(current); }
}
function goBack() {
    if (current > 0) { current--; renderQuestion(current); }
}

/* ─── SUBMIT ─── */
function submitQuiz() {
    let score = 0;
    questions.forEach((q, i) => {
        const correctIndices = q.options.map((o, j) => o.correct ? j : -1).filter(j => j >= 0);
        const userIndices    = answers[i].slice().sort();
        const isCorrect      = JSON.stringify(correctIndices.sort()) === JSON.stringify(userIndices);
        if (isCorrect) score++;
    });

    document.getElementById('question-card').style.display  = 'none';
    document.getElementById('progress-wrap').style.display  = 'none';
    document.getElementById('result-card').classList.add('show');

    const total = questions.length;
    const pct   = Math.round((score / total) * 100);
    document.getElementById('big-score').textContent = score + ' / ' + total;
    document.getElementById('result-icon').textContent =
        pct === 100 ? '🏆' : pct >= 75 ? '🎉' : pct >= 50 ? '📚' : '💡';
    document.getElementById('result-sub').textContent =
        pct === 100 ? 'Отличный результат! Все ответы верны.' :
        pct >= 75   ? 'Хороший результат! Почти всё правильно.' :
        pct >= 50   ? 'Неплохо, но есть над чем поработать.' :
                      'Стоит повторить материал. Удачи в следующий раз!';

    buildAnswersTable();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─── ANSWERS TABLE ─── */
function buildAnswersTable() {
    const tbody = document.getElementById('answers-tbody');
    tbody.innerHTML = '';

    questions.forEach((q, i) => {
        const correctIndices = q.options.map((o, j) => o.correct ? j : -1).filter(j => j >= 0);
        const userIndices    = answers[i].slice().sort();
        const isCorrect      = JSON.stringify(correctIndices.sort()) === JSON.stringify(userIndices);

        // Helper: get display text for a set of option indices
        function optTexts(indices) {
            if (!indices.length) return '<em style="color:var(--muted)">—</em>';
            return indices.map(idx => {
                // Extract just the letter prefix (А, Б, В, Г...) and the rest of the text
                const t = q.options[idx].text;
                return '<span>' + t + '</span>';
            }).join('<br>');
        }

        const tr = document.createElement('tr');
        tr.className = isCorrect ? 'row-ok' : 'row-bad';

        // Truncate question text for the table
        const shortQ = q.text.length > 70 ? q.text.slice(0, 68) + '…' : q.text;

        tr.innerHTML =
            '<td class="ans-num">' + (i + 1) + '</td>' +
            '<td class="ans-q">' + shortQ + '</td>' +
            '<td class="ans-a">' + optTexts(userIndices) + '</td>' +
            '<td class="ans-a">' + optTexts(correctIndices) + '</td>' +
            '<td class="ans-v ' + (isCorrect ? 'ok' : 'bad') + '">' + (isCorrect ? '✓' : '✗') + '</td>';

        tbody.appendChild(tr);
    });

    document.getElementById('answers-wrap').classList.add('show');
}

/* ─── REVIEW ─── */
function showReview() {
    const rc = document.getElementById('review-container');
    rc.innerHTML = '';
    rc.classList.add('show');

    questions.forEach((q, i) => {
        const correctIndices = q.options.map((o, j) => o.correct ? j : -1).filter(j => j >= 0);
        const userIndices    = answers[i];

        const card = document.createElement('div');
        card.className = 'review-card';

        const badge = document.createElement('div');
        badge.className = 'q-type-badge';
        const isCorrect = JSON.stringify(correctIndices.sort()) === JSON.stringify(userIndices.slice().sort());
        badge.textContent = isCorrect ? '✓ Верно' : '✗ Неверно';
        badge.style.color = isCorrect ? '#27ae60' : '#e74c3c';
        badge.style.background = isCorrect ? '#d5f5e3' : '#fadbd8';

        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.style.marginBottom = '16px';
        qText.textContent = q.text;

        const opts = document.createElement('div');
        opts.className = 'options';

        q.options.forEach((opt, oIndex) => {
            const label = document.createElement('label');
            label.className = 'option-label';

            const input = document.createElement('input');
            input.type = q.type;
            input.name = 'review-q' + i;
            input.value = oIndex;
            input.disabled = true;
            input.checked = userIndices.includes(oIndex);

            if (opt.correct) label.classList.add('correct');
            else if (userIndices.includes(oIndex) && !opt.correct) label.classList.add('incorrect');

            const span = document.createElement('span');
            span.textContent = opt.text;

            label.appendChild(input);
            label.appendChild(span);
            opts.appendChild(label);
        });

        card.appendChild(badge);
        card.appendChild(qText);
        card.appendChild(opts);
        rc.appendChild(card);
    });

    rc.scrollIntoView({ behavior: 'smooth' });
}

/* ─── RESTART ─── */
function restartQuiz() {
    questions = pickQuestions();          // новый случайный набор
    answers   = questions.map(() => []);
    current   = 0;
    document.getElementById('result-card').classList.remove('show');
    document.getElementById('answers-wrap').classList.remove('show');
    document.getElementById('answers-tbody').innerHTML = '';
    document.getElementById('review-container').classList.remove('show');
    document.getElementById('review-container').innerHTML = '';
    document.getElementById('main-header').style.display   = 'none';
    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('question-card').style.display = 'none';
    document.getElementById('title-screen').style.display  = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
