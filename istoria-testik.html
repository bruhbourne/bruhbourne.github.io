        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // Функция запуска теста по клику на кнопку титульной страницы
    function startQuiz() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('nav-panel').style.display = 'flex';
        initQuiz();
    }

    function initQuiz() {
        // Копируем исходный массив, перемешиваем его и берем первые 20 элементов (или меньше, если их пока нет 20)
        selectedQuestions = shuffleArray([...questionsPool]).slice(0, QUESTIONS_LIMIT);
        
        const container = document.getElementById('quiz-container');
        let html = '';

        selectedQuestions.forEach((q, qIndex) => {
            const type = q.multi ? 'checkbox' : 'radio';
            const name = 'q' + qIndex;
            html += `<div class="question-block" id="block-${qIndex}">`;
            html += `<h3>${qIndex + 1}. ${q.text}</h3>`;
            q.options.forEach((opt, oIndex) => {
                html += `
                    <label class="option">
                        <input type="${type}" name="${name}" data-correct="${opt.correct}">
                        ${opt.text}
                    </label>`;
            });
            html += `</div>`;
        });

        container.innerHTML = html;
        updateQuizView();
    }

    function updateQuizView() {
        const blocks = document.querySelectorAll('.question-block');
        
        // Показываем только текущий вопрос
        blocks.forEach((block, index) => {
            block.style.display = (index === currentQuestion) ? 'block' : 'none';
        });

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Управляем видимостью кнопки "Назад"
        prevBtn.style.visibility = (currentQuestion === 0) ? 'hidden' : 'visible';
        
        // Меняем текст кнопки на последнем вопросе
        if (currentQuestion === selectedQuestions.length - 1) {
            nextBtn.innerText = 'Проверить результаты';
        } else {
            nextBtn.innerText = 'Далее';
        }
    }

    function changeQuestion(step) {
        if (step === 1 && currentQuestion === selectedQuestions.length - 1) {
            checkAnswers();
            return;
        }
        
        currentQuestion += step;
        updateQuizView();
    }

    function checkAnswers() {
        let score = 0;
        const blocks = document.querySelectorAll('.question-block');

        blocks.forEach(block => {
            const inputs = block.querySelectorAll('input');
            let isBlockCorrect = true;

            inputs.forEach(input => {
                const isCorrect = input.dataset.correct === 'true';
                const isChecked = input.checked;
                const label = input.parentElement;
                label.classList.remove('correct', 'incorrect');

                if (isCorrect) {
                    label.classList.add('correct');
                }
                if (isChecked && !isCorrect) {
                    label.classList.add('incorrect');
                }
                if (isCorrect !== isChecked) {
                    isBlockCorrect = false;
                }
            });

            if (isBlockCorrect) score++;
        });

        const total = selectedQuestions.length;
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerText = `Ваш результат: ${score} из ${total} правильных ответов!`;
        resultsDiv.style.display = 'block';

        if (score === total) {
            resultsDiv.style.backgroundColor = '#d4edda';
            resultsDiv.style.color = '#155724';
        } else if (score >= total / 2) {
            resultsDiv.style.backgroundColor = '#fff3cd';
            resultsDiv.style.color = '#856404';
        } else {
            resultsDiv.style.backgroundColor = '#f8d7da';
            resultsDiv.style.color = '#721c24';
        }

        // Показываем все блоки с вопросами и скрываем навигацию для разбора ошибок
        blocks.forEach(block => block.style.display = 'block');
        document.getElementById('nav-panel').style.display = 'none';

        resultsDiv.scrollIntoView({ behavior: 'smooth' });
    }
</script>
