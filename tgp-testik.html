<style>
/* --- СТИЛИ --- */
body { margin: 0; padding: 0; background: #111; color: #eee; font-family: Arial, sans-serif; }
header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #333; background: #1a1a1a; }
h1 { margin: 0; font-size: 32px; }
.creator { margin-top: 10px; color: #999; }
.container { max-width: 800px; margin: 40px auto; padding: 20px; }
.card { background: #1a1a1a; border: 1px solid #2f2f2f; border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.question-counter { color: #888; font-size: 14px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
.question-text { font-size: 20px; line-height: 1.5; margin-bottom: 25px; font-weight: bold; }
.options { display: flex; flex-direction: column; gap: 12px; }
.option-label { display: flex; align-items: flex-start; background: #222; padding: 15px; border-radius: 8px; cursor: pointer; border: 1px solid #333; transition: background 0.2s; }
.option-label:hover { background: #2a2a2a; }
.option-label input { margin-top: 4px; margin-right: 15px; transform: scale(1.2); cursor: pointer; }
.btn { margin-top: 25px; background: #fff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; }
.btn:hover { background: #ddd; }
.btn:disabled { background: #555; color: #888; cursor: not-allowed; }
.feedback { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 16px; display: none; }
.feedback.correct { display: block; background: rgba(76, 175, 80, 0.1); color: #4CAF50; border: 1px solid #4CAF50; }
.feedback.incorrect { display: block; background: rgba(244, 67, 54, 0.1); color: #F44336; border: 1px solid #F44336; }
.correct-answers-list { margin-top: 10px; color: #fff; font-weight: normal; }
.option-label.is-correct { background: rgba(76, 175, 80, 0.15); border-color: #4CAF50; color: #4CAF50; font-weight: bold; }
.option-label.is-wrong { background: rgba(244, 67, 54, 0.15); border-color: #F44336; color: #F44336; text-decoration: line-through; }
.results-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1a1a1a; font-size: 14px; }
.results-table th, .results-table td { border: 1px solid #333; padding: 12px; text-align: left; }
.results-table th { background: #222; color: #ccc; }
.res-correct { color: #4CAF50; font-weight: bold; }
.res-incorrect { color: #F44336; font-weight: bold; }
.score-board { text-align: center; font-size: 24px; margin-bottom: 30px; padding: 20px; background: #222; border-radius: 12px; }
footer { text-align: center; padding: 30px; color: #777; }
</style>
</head>

</div>

        <div class="card"><div class="question">10. К исполнительным органам государства относятся: (пометить 3)</div><div class="answer"><ul><li>Правительство;</li><li>Министерство;</li><li>Премьер-министр;</li></ul></div></div>

        <div class="card"><div class="question">12. В соответствии с принципом разделения властей органы государства делятся на:</div><div class="answer"><ul><li>судебные;</li><li>исполнительные;</li><li>законодательные;</li></ul></div></div>

        <div class="card"><div class="question">39. К подзаконным нормативно-правовым актам относятся:</div><div class="answer"><ul><li>постановления правительства РФ;</li><li>указы президента РФ;</li><li>акты представительных органов местного самоуправления;</li></ul></div></div>

        <div class="card"><div class="question">297. В настоящее время федеральными государствами является: Мексика, Бразилия, Канада, Бельгия</div><div class="answer"><ul><li>Целенаправленное воздействие государства, его органов на общество в целом, те или иные его сферы (экономические, социальную, духовную) на основе объективных законов для выполнения стоящих перед обществом задач и функции – это Государственная власть.</li><li>Факторами, обуславливающими процесс возникновения государства, являются.</li><li>переход от присевающей экономике</li><li>социальная стратификация</li><li>природные катаклизмы</li></ul></div></div>
        <div class="card"><div class="question">298. Признание населением страны необходимости и правомерности действующих институтов государственной власти: легитимность</div><div class="answer"><ul><li>Организация государственной власти, выраженная в форме правления, государственного устройства и политического(государственного) режима – это форма государства</li><li>Основные направления деятельности государства, выражающие его сущность, социальное назначение, задачи и цели по управлению обществом в присущих ему формах и свойственными его методам – это функции государства</li></ul></div></div>
        <div class="card"><div class="question">299. К функциям государства, вытекающих из противоречий внутри общества, относится: разрешение межнациональных конфликтов</div><div class="answer"><ul><li>Государственный аппарат, построенный и действующий на основе демократизма, пользующийся авторитетом и поддержкой населения – легитивный</li><li>Государственная власть, которая официально провозглашается, правомерно устанавливается и функционирует в режиме законности, приобретает следующее свойство легальность</li><li>Первичная структурная часть механизма (аппарата) государства, участвующая в осуществлении функций государства и наделённая властными полномочиями = государственный орган</li><li>Деление федеративных государств осуществляется на основе</li><li>территориального принципа</li><li>национального принципа</li><li>Нормы первобытного общества, являвшиеся одновременно и нормами организации общественной жизни, и нормами первобытной морали называются мононормами</li></ul></div></div>
        <div class="card"><div class="question">300. Убежденность народа в непогрешность вождей(лидеров) характерна для следующего типа легитимации власти: харизматического</div><div class="answer"><ul><li>Государственно-властные полномочия (совокупность прав и обязанностей) определенного содержания и объема, которыми наделен государственный орган, называется компетенция</li></ul></div></div>
        <div class="card"><div class="question">301. Подчинение народа общим разумным законам, перед которыми все без исключения равны, характерна для следующего типа легитимации власти: рациональный</div><div class="answer"><ul><li>Признаками субъекта политической системы является</li><li>выражение интересов и целей какой-либо социальной обности</li><li>осуществление деятельности субъекта на легитимной основе</li><li>Признаками демократического политического режима является</li><li>реализация власти правовыми методами</li><li>обладание высшими органами государства мандатом народа</li><li>всесторонняя защита прав и свобод человека и гражданина</li><li>Система отношений господства и подчинения, концентрированная выражением….</li><li>государственная власть</li><li>Опора государства на силу вековых традиций и обычаев характерна для следубщего типа легитимации власти</li><li>традиционной</li><li>Элементом формы государства, характеризующий организацию верховной государственной власти, порядок образования ее органов и их взаимоотношения- форма правления</li><li>Должность главы правительства в Германии называется канцлер</li><li>Определение государства как машины для угнетения одного класса другим сформировал Ленин</li></ul></div></div>
`;
// ==========================================
// КОНЕЦ БАЗЫ ВОПРОСОВ. НИЖЕ НИЧЕГО НЕ ТРОГАТЬ
// ==========================================

// Загружаем текст в скрытый блок
document.getElementById('data-store').innerHTML = rawHTMLData;

// --- ТОТ САМЫЙ ПАРСЕР И ЛОГИКА ТЕСТА ---
let allQuestions = [];
let allAnswersPool = [];
let selectedQuestions = [];
let currentQIndex = 0;
let userResults = [];

const extraTgpDistractors = [
    "правовой обычай", "судебный прецедент", "нормативный договор",
    "кодификация", "инкорпорация", "консолидация",
    "гипотеза", "диспозиция", "санкция",
    "федерация", "конфедерация", "унитарное государство",
    "республика", "монархия", "авторитаризм", "демократия",
    "правоспособность", "дееспособность", "деликтоспособность"
];

// Парсер запускается сразу (без ожидания, так надежнее)
const rawCards = document.querySelectorAll('#data-store .card');

rawCards.forEach(card => {
    // ИСПОЛЬЗУЕМ textContent ВМЕСТО innerText
    let qNode = card.querySelector('.question');
    if (!qNode) return; // Защита от пустых карточек
    
    let qText = qNode.textContent.trim();
    qText = qText.replace(/^\d+\.\s*/, ''); 
    
    const lis = card.querySelectorAll('.answer ul li');
    let answers = Array.from(lis)
        // ИСПОЛЬЗУЕМ textContent ВМЕСТО innerText
        .map(li => li.textContent.replace(/;|\.$/, '').trim())
        .filter(a => a.length > 2);
    
    if(answers.length > 0) {
        let match = qText.match(/\((?:пометить|указать)\s*(\d+)\)/i);
        let requiredCount = match ? parseInt(match[1]) : answers.length;
        let isMulti = requiredCount > 1;

        allQuestions.push({
            question: qText,
            correctAnswers: answers,
            isMulti: isMulti,
            requiredCount: requiredCount
        });
        
        answers.forEach(a => {
            if(!allAnswersPool.includes(a)) {
                allAnswersPool.push(a);
            }
        });
    }
});

function startQuiz() {
    if (allQuestions.length === 0) {
        alert("Ошибка: вопросы не загрузились. Проверьте структуру HTML.");
        return;
    }
    
    allQuestions.sort(() => 0.5 - Math.random());
    selectedQuestions = allQuestions.slice(0, 35);
    currentQIndex = 0;
    userResults = [];
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    renderQuestion();
}

function getDistractors(correctArr, neededCount) {
    let distractors = [];
    let fullPool = [...allAnswersPool, ...extraTgpDistractors].sort(() => 0.5 - Math.random());
    for (let item of fullPool) {
        let isConflict = correctArr.some(c => c.toLowerCase().includes(item.toLowerCase()) || item.toLowerCase().includes(c.toLowerCase()));
        if (!isConflict && !distractors.includes(item)) {
            distractors.push(item);
        }
        if (distractors.length >= neededCount) break;
    }
    return distractors;
}

function renderQuestion() {
    const q = selectedQuestions[currentQIndex];
    document.getElementById('q-counter').innerText = `Вопрос ${currentQIndex + 1} из ${selectedQuestions.length}`;
    document.getElementById('q-text').innerText = q.question;
    const optionsContainer = document.getElementById('q-options');
    optionsContainer.innerHTML = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'inline-block';
    document.getElementById('next-btn').style.display = 'none';
    
    let options = [...q.correctAnswers];
    let falseOptionsCount = q.isMulti ? 3 : 3; 
    let distractors = getDistractors(q.correctAnswers, falseOptionsCount);
    options = options.concat(distractors);
    options.sort(() => 0.5 - Math.random());
    
    let inputType = q.isMulti ? 'checkbox' : 'radio';
    options.forEach((opt) => {
        const label = document.createElement('label');
        label.className = 'option-label';
        const input = document.createElement('input');
        input.type = inputType;
        input.name = 'q_option';
        input.value = opt;
        label.appendChild(input);
        label.appendChild(document.createTextNode(opt));
        optionsContainer.appendChild(label);
    });
}

function checkAnswer() {
    const q = selectedQuestions[currentQIndex];
    const inputs = document.querySelectorAll('input[name="q_option"]:checked');
    if (inputs.length === 0) {
        alert("Пожалуйста, выберите вариант ответа.");
        return;
    }
    const userAnswers = Array.from(inputs).map(inp => inp.value);
    let isCorrect = false;
    
    if (q.isMulti) {
        let matched = userAnswers.filter(ans => q.correctAnswers.includes(ans));
        if (matched.length === q.correctAnswers.length && userAnswers.length === q.correctAnswers.length) {
            isCorrect = true;
        }
    } else {
        if (userAnswers.length === 1 && q.correctAnswers.includes(userAnswers[0])) {
            isCorrect = true;
        }
    }
    
    const feedbackDiv = document.getElementById('feedback');
    if (isCorrect) {
        feedbackDiv.className = 'feedback correct';
        feedbackDiv.innerHTML = '<b>✓ Верно!</b>';
    } else {
        feedbackDiv.className = 'feedback incorrect';
        feedbackDiv.innerHTML = '<b>✗ Неверно.</b> Правильные ответы выделены зелёным.';
    }

    // Подсветка вариантов
    document.querySelectorAll('input[name="q_option"]').forEach(inp => {
        inp.disabled = true;
        const label = inp.closest('label');
        const isCorrectOpt = q.correctAnswers.includes(inp.value);
        const isChecked = inp.checked;
        if (isCorrectOpt) {
            label.classList.add('is-correct');
        } else if (isChecked && !isCorrectOpt) {
            label.classList.add('is-wrong');
        }
    });

    userResults.push({
        question: q.question,
        userAns: userAnswers.join(', '),
        correctAns: q.correctAnswers.join(', '),
        isCorrect: isCorrect
    });
    document.getElementById('submit-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'inline-block';
    
    if (currentQIndex === selectedQuestions.length - 1) {
        document.getElementById('next-btn').innerText = 'Завершить тест';
    }
}

function nextQuestion() {
    currentQIndex++;
    if (currentQIndex < selectedQuestions.length) {
        renderQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    
    const correctCount = userResults.filter(r => r.isCorrect).length;
    const total = userResults.length;
    const percent = Math.round((correctCount / total) * 100);
    
    document.getElementById('score-board').innerHTML = `
        Вы ответили верно на <span style="color: #4CAF50;">${correctCount}</span> из ${total} вопросов.<br>
        Успешность: <b>${percent}%</b>
    `;
    
    const tbody = document.getElementById('results-tbody');
    tbody.innerHTML = '';
    
    userResults.forEach((res, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${res.question}</td>
            <td>${res.userAns || '<i>Нет ответа</i>'}</td>
            <td>${res.correctAns}</td>
            <td class="${res.isCorrect ? 'res-correct' : 'res-incorrect'}">
                ${res.isCorrect ? 'Верно' : 'Неверно'}
            </td>
        `;
        tbody.appendChild(tr);
    });
}
</script>
